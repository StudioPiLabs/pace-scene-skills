# The closed vocabularies this skill answers in.
#
# SKILL.md points here rather than restating them, because a vocabulary
# written twice is a vocabulary that will eventually disagree with itself.
# They are the compilers' own enum values: a token outside these lists
# produces a field nothing downstream can read. A skill is only as typed as
# the vocabulary it answers in.

shot_size:
  - extreme_close_up
  - close_up
  - medium_close_up
  - medium
  - medium_full
  - full
  - wide
  - extreme_wide

angle:
  - eye_level
  - low_angle
  - high_angle
  - overhead
  - dutch

# Rig behaviour and framing moves are different fields. A rig (handheld,
# steadicam, tripod) belongs to the trajectory's `gear`; a framing move
# (push_in, crane_up, tracking) belongs to `movement_3d`. Both kinds of name
# appear here because one corpus already stored `handheld` where it is not a
# legal value and lost it to a `tripod` default. Say which one you mean.
camera_movement:
  - static
  - handheld
  - steadicam
  - crane_up
  - crane_down
  - push_in
  - pull_out
  - tracking

# The film's own top matter, under the headings a treatment uses. This skill
# reads theme, worldview and genre; pass the author's own sentence under each
# through verbatim, since a model asked to summarise a worldview writes a new
# worldview.
film_top_matter:
  genre:     题材
  source:    核心溯源
  worldview: 世界观设定
  theme:     核心主题
