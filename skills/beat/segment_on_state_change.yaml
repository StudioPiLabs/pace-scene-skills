id: segment_on_state_change
level: beat
consumes: [script_ir, world_state_timeline]
produces: [beats]

# The one decomposition here that carries a decision rule rather than a
# definition. A beat is the smallest unit in which the world changes, so each
# one can hand a panel a claim the compiler has to discharge and the delivered
# frame can be read against. The gain over asking a model to split the scene
# is not a better cut but a checkable one.
unit: |
  Each beat is a triple (state_before, transition, state_after). The state is
  read from a world-state timeline, not from the beat's own events, which is
  what stops a later beat quietly restoring what an earlier one changed.

features:
  state_change:     {weight: 0.30, source: ir,          measured: true}
  focus_shift:      {weight: 0.20, source: ir,          measured: true,
                     note: "design calls it causal_shift; whether the actor differs"}
  goal_shift:       {weight: 0.15, source: adjudicator, measured: true}
  spatial_shift:    {weight: 0.15, source: none,        measured: false,
                     note: "events carry no location of their own; left unmeasured
                            rather than invented from text distance"}
  reveal:           {weight: 0.10, source: adjudicator, measured: true}
  importance_delta: {weight: 0.10, source: ir,          measured: true}

# Renormalised over what was actually measured, so the score stays on [0,1]
# and a corpus missing one feature does not silently become unable to split.
score: sum(w_g * f_g for g in measured) / sum(w_g for g in measured)

thresholds:
  tau_high: 0.55
  tau_low:  0.20

# A single strong signal is sufficient on its own. This is a measured choice,
# not a preference: under the weighted sum alone 40 of 41 adjudicated pairs
# merged, and admitting one strong signal took one film from 26 beats to 39.
sufficient_alone:
  state_change: 1.0
  goal_shift:   0.7
  reveal:       0.7

decision: |
  SPLIT       if any feature reaches its sufficient_alone threshold, or score >= tau_high
  MERGE       if score <= tau_low
  ADJUDICATE  otherwise

# Both keep the events together, because over-splitting produces beats with no
# state change in them, and those have nothing to depict.
ties_go_to: merge

not_evaluated: |
  Where the boundaries belong is not measured. A partition holds by
  construction and any sound merge rule preserves the transitions, so neither
  count distinguishes a 39-beat cut from a 26-beat or a 79-beat one. Scoring
  it would take a human reference segmentation and WindowDiff / P_k.
