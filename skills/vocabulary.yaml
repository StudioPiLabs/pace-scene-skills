# The closed vocabularies every skill above returns into. They are the
# compilers' own enum values, so a skill that returns a token outside them
# produces a field nothing downstream can read. Keep this file and the
# schema's enums in step; a skill is only as typed as the vocabulary it
# answers in.

shot_size:
  - extreme_close_up
  - close_up
  - medium_close_up
  - medium
  - medium_full
  - full
  - wide
  - extreme_wide

angle:
  - eye_level
  - low_angle
  - high_angle
  - overhead
  - dutch

# Rig behaviour belongs to trajectory.gear; framing moves belong to
# movement_3d. One corpus already stored `handheld` where it is not a legal
# value and lost it to a `tripod` default, which is why both live here and
# the distinction is written down.
camera_movement:
  - static
  - handheld
  - steadicam
  - crane_up
  - crane_down
  - push_in
  - pull_out
  - tracking

# What the film's own top matter is called, in the terms a treatment uses.
# `derive_shot_design` reads all three.
film_top_matter:
  genre:     题材
  source:    核心溯源
  worldview: 世界观设定
  theme:     核心主题
