id: split_into_scenes
level: scene
produces: [scene_number, heading, location_raw, time_of_day, characters_present,
           summary, story_beat, story_text, implied_shot_count, key_actions,
           era, region, culture]

# The boundary rule. This is the criterion, not a hint: a scene ends where one
# of these three changes, and nowhere else. It is the definition screenplay
# practice already uses, and the one Zehe et al. formalise for fiction (time,
# location, character constellation, focused action); the fourth of theirs,
# focused action, is deliberately not a boundary here, because an action
# change inside one location at one time is a SHOT boundary, not a scene one.
boundary:
  criterion: |
    A scene = continuous action in ONE location at ONE time-of-day with ONE
    set of characters. A scene change occurs whenever location, time, OR all
    characters leave / enter.
  changes_on: [location, time_of_day, character_constellation]
  does_not_change_on: [focused_action]   # that is the shot level

# key_actions sets the initial shot granularity: one shot and one starter
# panel per action. Read the caveat before relying on the count.
shot_granularity:
  field: key_actions
  definition: the discrete physical actions that drive the scene
  expansion: one shot and one starter panel per action
  caveat: |
    This is a definition, not a decision rule. Nothing in it says what makes
    two movements one action rather than two, so the granularity is the
    model's. It reads nothing from the world-state timeline, which is what
    separates it from segment_on_state_change. Where the cuts belong at this
    level is not evaluated.

fields:
  scene_number:       {type: int, note: "1-indexed"}
  heading:            {type: str, format: "INT./EXT. LOCATION - TIME OF DAY, uppercase"}
  interior_exterior:  {type: enum, values: [INT, EXT]}
  location_raw:       {type: str, note: "location as it appears in the text"}
  time_of_day:        {type: str, examples: [night, morning, dusk, afternoon]}
  characters_present: {type: "list[str]", note: lowercase}
  summary:            {type: str, note: one sentence}
  story_beat:         {type: str, note: "1-3 word arc tag: opening / first connection / climax"}
  story_text:         {type: str, note: the verbatim text passages that fall in this scene}
  implied_shot_count: {type: int, note: rough estimate of shots needed to cover the scene}
  key_actions:        {type: "list[str]", note: the discrete physical actions that drive the scene}
  era:                {type: "str|null", note: "period; null if unknowable"}
  region:             {type: "str|null", note: "place/setting; null if unknowable"}
  culture:            {type: "str|null", note: "short snake_case cultural/visual context tag"}

# era/region/culture are inferred from the scene's own content. Naming a film
# the model might recognise invites it to answer from the film instead of the
# text.
inference_rule: |
  Infer era / region / culture from the scene's own content (period cues,
  place names, characters, props) — do NOT assume any specific film.

output: |
  Return ONE JSON object: {"scenes": [...]}. No prose, no markdown fences.
